[package]
name = "crux"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
