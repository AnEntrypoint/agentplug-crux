name: release-modlens

on:
  workflow_dispatch:

concurrency:
  group: agentplug-modlens-release
  cancel-in-progress: false

jobs:
  release:
    uses: AnEntrypoint/rs-plugkit/.github/workflows/wasm-plugin-release.yml@main
    with:
      source_repository: AnEntrypoint/agentplug-modlens
      wasm_artifact_name: agentplug_modlens.wasm
      published_asset_basename: modlens
      release_repo: AnEntrypoint/agentplug-modlens-bin
      release_title_prefix: agentplug-modlens
      build_command: cargo build --release --target wasm32-wasip1 --lib
      release_signing_key_id: plugin-release-20261006-2
      release_signing_public_key: 022fa8098b8fcbc63a63b5ff5d49d4246a5c89d8cabc14925087fcab728bf6f0
    secrets:
      publisher_token: ${{ secrets.PUBLISHER_TOKEN }}
      release_signing_key: ${{ secrets.RELEASE_SIGNING_KEY }}
