name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: agentplug-crux-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: AnEntrypoint/rs-plugkit/.github/workflows/wasm-plugin-release.yml@main
    with:
      wasm_artifact_name: agentplug_crux.wasm
      published_asset_basename: crux
      release_repo: AnEntrypoint/agentplug-crux-bin
      release_title_prefix: agentplug-crux
      build_command: cargo build --release --target wasm32-wasip1 --lib
    secrets:
      publisher_token: ${{ secrets.PUBLISHER_TOKEN }}
      release_signing_key: ${{ secrets.RELEASE_SIGNING_KEY }}
